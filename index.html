        .bg-particles span:nth-child(2){left:25%;animation-duration:15s;animation-delay:2s;}
        .bg-particles span:nth-child(3){left:40%;animation-duration:10s;animation-delay:4s;}
        .bg-particles span:nth-child(4){left:55%;animation-duration:18s;animation-delay:1s;}

    <script>
        // 轮播逻辑
        (function(){
            const slides=document.querySelectorAll('.carousel-slide');
            const dots=document.querySelectorAll('.dot');
            let idx=0,timer;
            function go(n){
                slides.forEach(s=>s.classList.remove('active'));
                dots.forEach(d=>d.classList.remove('active'));
                idx=(n+slides.length)%slides.length;
                slides[idx].classList.add('active');
                dots[idx].classList.add('active');
            }
            function next(){go(idx+1);}
            function prev(){go(idx-1);}
            function play(){clearInterval(timer);timer=setInterval(next,5000);}
            function stop(){clearInterval(timer);}
            document.querySelector('.carousel-btn.next').addEventListener('click',()=>{next();play();});
            document.querySelector('.carousel-btn.prev').addEventListener('click',()=>{prev();play();});
            dots.forEach(d=>d.addEventListener('click',()=>{
                go(parseInt(d.dataset.index));
                play();
            }));
            const ct=document.querySelector('.carousel-container');
            ct.addEventListener('mouseenter',stop);
            ct.addEventListener('mouseleave',play);
            let tx=0;
            ct.addEventListener('touchstart',e=>{tx=e.changedTouches[0].screenX;stop();},{passive:true});
            ct.addEventListener('touchend',e=>{
                if(e.changedTouches[0].screenX<tx-40)next();
                if(e.changedTouches[0].screenX>tx+40)prev();
                play();
            });
            play();
        })();
    </script>

            footer_text:'© 2026 Smart Garbage Sorting Robot Team',
            footer_sub:'Team Members'
        };
        const dict={zh,en};
        let current='zh';
        function applyLang(lang){
            document.querySelectorAll('[data-key]').forEach(el=>{
                const key=el.dataset.key;
                if(dict[lang][key]) el.innerHTML=dict[lang][key];
            });
        }
        document.getElementById('langBtn').addEventListener('click',()=>{
            current=current==='zh'?'en':'zh';
            document.getElementById('langBtn').textContent=current==='zh'?'🌐 English':'🌐 中文';
            applyLang(current);
        });
        applyLang('zh');
    </script>
</body>
</html>
