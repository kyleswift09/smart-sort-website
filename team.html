<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>团队成员 - 智能垃圾分类存储机器人</title>
    <style>
        :root {
            --bg-primary: #080d18;--bg-card: #111827;--text-primary: #e8eaed;--text-secondary: #a0aab4;
            --accent-cyan: #00e5ff;--glow-cyan: rgba(0,229,255,0.3);--border-subtle: rgba(255,255,255,0.06);
            --font-display: 'Orbitron','Noto Sans SC',sans-serif;--font-body: 'Noto Sans SC','Segoe UI',sans-serif;
            --font-mono: 'JetBrains Mono','Courier New',monospace;
        }
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:var(--font-body);background:var(--bg-primary);color:var(--text-primary);line-height:1.6;}
        .bg-grid{position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:0;opacity:0.04;background-image:linear-gradient(rgba(255,255,255,0.3) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.3) 1px,transparent 1px);background-size:50px 50px;}
        .top-nav{position:fixed;top:0;left:0;right:0;z-index:1000;background:rgba(8,13,24,0.85);backdrop-filter:blur(20px);border-bottom:1px solid rgba(0,229,255,0.15);padding:0 5%;display:flex;align-items:center;justify-content:space-between;height:60px;}
        .nav-brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:#fff;}
        .nav-logo{width:36px;height:36px;border-radius:8px;background:linear-gradient(135deg,var(--accent-cyan),#2979ff);display:flex;align-items:center;justify-content:center;font-size:1.2rem;box-shadow:0 0 16px var(--glow-cyan);}
        .nav-title{font-family:var(--font-display);font-size:1.1rem;font-weight:600;letter-spacing:1.5px;}
        .nav-title span{color:var(--accent-cyan);}
        .nav-actions{display:flex;align-items:center;gap:16px;}
        .nav-link{color:var(--text-secondary);text-decoration:none;font-size:0.9rem;font-family:var(--font-mono);padding:6px 12px;border-radius:6px;transition:0.2s;}
        .nav-link:hover{color:var(--accent-cyan);background:rgba(0,229,255,0.08);}
        .nav-link.active{color:var(--accent-cyan);border-bottom:2px solid var(--accent-cyan);}
        .lang-btn{background:rgba(0,229,255,0.08);border:1px solid rgba(0,229,255,0.3);color:var(--accent-cyan);padding:7px 16px;border-radius:20px;cursor:pointer;font-family:var(--font-mono);font-size:0.8rem;}
        .page-content{position:relative;z-index:10;max-width:1100px;margin:0 auto;padding:100px 5% 50px;}
        .page-hero{text-align:center;margin-bottom:50px;}
        .page-hero h1{font-family:var(--font-display);font-size:2.5rem;letter-spacing:3px;text-shadow:0 0 30px var(--glow-cyan);}
        .hero-line{width:80px;height:3px;background:var(--accent-cyan);margin:16px auto;box-shadow:0 0 12px var(--accent-cyan);}
        .page-hero p{color:var(--text-secondary);font-size:1.1rem;}
        .team-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px;}
        .member-card{background:var(--bg-card);border:1px solid var(--border-subtle);border-radius:16px;padding:28px 24px;text-align:center;transition:0.4s;position:relative;overflow:hidden;}
        .member-card:hover{transform:translateY(-6px);border-color:rgba(0,229,255,0.4);box-shadow:0 12px 32px rgba(0,0,0,0.5);}
        .member-avatar{width:70px;height:70px;border-radius:50%;background:linear-gradient(135deg,var(--accent-cyan),#2979ff);display:flex;align-items:center;justify-content:center;font-size:1.8rem;margin:0 auto 16px;color:#fff;}
        .member-card h3{font-family:var(--font-display);font-size:1.2rem;color:#fff;margin-bottom:4px;}
        .member-role{color:var(--accent-cyan);font-family:var(--font-mono);font-size:0.8rem;margin-bottom:12px;}
        .member-info{color:var(--text-secondary);font-size:0.85rem;line-height:1.8;}
        .member-info span{color:#fff;font-family:var(--font-mono);}
        @media(max-width:768px){.page-content{padding:80px 4% 30px;}.page-hero h1{font-size:1.8rem;}}
    </style>
</head>
<body>
<div class="bg-grid"></div>
<nav class="top-nav">
    <a href="index.html" class="nav-brand">
        <div class="nav-logo">♻</div>
        <div class="nav-title">Smart<span>Sort</span></div>
    </a>
    <div class="nav-actions">
        <a href="index.html" class="nav-link" data-key="nav_home">首页</a>
        <a href="about.html" class="nav-link" data-key="nav_about">关于</a>
        <a href="team.html" class="nav-link active" data-key="nav_team">团队</a>
        <a href="philosophy.html" class="nav-link" data-key="nav_phil">理念</a>
        <button class="lang-btn" id="langBtn">🌐 English</button>
    </div>
</nav>
<div class="page-content">
    <div class="page-hero">
        <h1 data-key="page_title">团队成员</h1>
        <div class="hero-line"></div>
        <p data-key="page_sub">第44组 · 垃圾分对有限公司</p>
    </div>
    <div class="team-grid" id="teamContainer"></div>
</div>
<script>
    const members=[
        {name:'张豫江',roleKey:'r1',id:'24019100044',phone:'138-0000-0001',emoji:'👨‍💼'},
        {name:'洪晨凯',roleKey:'r2',id:'24019100253',phone:'138-0000-0002',emoji:'👨‍💻'},
        {name:'徐舒涵',roleKey:'r3',id:'24019100583',phone:'138-0000-0003',emoji:'👩‍💼'},
        {name:'王若旭',roleKey:'r4',id:'24019100395',phone:'138-0000-0004',emoji:'👨‍🔧'},
        {name:'蒋康',roleKey:'r5',id:'24019100453',phone:'138-0000-0005',emoji:'👨‍🔧'},
        {name:'董欣',roleKey:'r6',id:'24019100349',phone:'138-0000-0006',emoji:'👩‍🔧'},
        {name:'康瑞麟',roleKey:'r7',id:'24019100023',phone:'138-0000-0007',emoji:'👨‍💻'}
    ];
    const container=document.getElementById('teamContainer');
    members.forEach(m=>{
        const card=document.createElement('div');
        card.className='member-card';
        card.innerHTML=`
            <div class="member-avatar">${m.emoji}</div>
            <h3>${m.name}</h3>
            <p class="member-role" data-key="${m.roleKey}"></p>
            <div class="member-info">
                <p><span data-key="label_id">学号：</span>${m.id}</p>
                <p><span data-key="label_phone">电话：</span>${m.phone}</p>
            </div>
        `;
        container.appendChild(card);
    });

    const zh={
        nav_home:'首页',nav_about:'关于',nav_team:'团队',nav_phil:'理念',
        page_title:'团队成员',page_sub:'第44组 · 垃圾分对有限公司',
        label_id:'学号：',label_phone:'电话：',
        r1:'项目经理 / 第二软件工程师',
        r2:'首席软件工程师 / 首席网页设计师',
        r3:'秘书 / 首席公关',
        r4:'首席机械设计师 / 首席组装工程师',
        r5:'首席电子和布线工程师 / 第二组装工程师',
        r6:'第二电子和布线工程师 / 第二数字系统工程师',
        r7:'首席数字系统工程师 / 第二网页设计师'
    };
    const en={
        nav_home:'Home',nav_about:'About',nav_team:'Team',nav_phil:'Philosophy',
        page_title:'Team Members',page_sub:'Group 44 · SortRight Co., Ltd.',
        label_id:'Student ID: ',label_phone:'Phone: ',
        r1:'Project Manager / Second Software Engineer',
        r2:'Chief Software Engineer / Chief Web Designer',
        r3:'Secretary / Chief Public Relations',
        r4:'Chief Mechanical Designer / Chief Assembly Engineer',
        r5:'Chief Electronics & Wiring Engineer / Second Assembly Engineer',
        r6:'Second Electronics & Wiring Engineer / Second Digital System Engineer',
        r7:'Chief Digital System Engineer / Second Web Designer'
    };
    const dict={zh,en};
    let current='zh';
    function apply(lang){
        document.querySelectorAll('[data-key]').forEach(el=>{
            const key=el.dataset.key;
            if(dict[lang][key]) el.textContent=dict[lang][key];
        });
    }
    document.getElementById('langBtn').addEventListener('click',()=>{
        current=current==='zh'?'en':'zh';
        document.getElementById('langBtn').textContent=current==='zh'?'🌐 English':'🌐 中文';
        apply(current);
    });
    apply('zh');
</script>
</body>
</html>
